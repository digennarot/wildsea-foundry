name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      ZIP_FILE_NAME: wildsea-foundry-${{ github.ref_name }}.zip
      MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/system.json
      DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wildsea-foundry-${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v7

      # Validate that the tag being released matches the package version.
      - name: Check version
        run: |
          PACKAGE_VERSION=$(jq -r .version system.json)
          if [[ "$TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "The system.json version does not match tag name."
            echo "system.json: $PACKAGE_VERSION"
            echo "tag name: $TAG"
            echo "Please fix this and push the tag again."
            exit 1
          fi

      # Point the released manifest at this release's zip.
      - name: Set manifest and download URLs
        run: |
          jq --arg manifest "$MANIFEST_URL" --arg download "$DOWNLOAD_URL" \
            '.manifest = $manifest | .download = $download' system.json > system.json.tmp
          mv system.json.tmp system.json

      # zip whitelist of files to distribute
      - name: Build zip
        run: zip "$ZIP_FILE_NAME" -r assets lang styles/*.css styles/fonts packs system templates CHANGELOG.md LICENSE README.md system.json template.json wildsea.js

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP_FILE_NAME" system.json \
            --title "$TAG" \
            --notes "**Installation:** To manually install this release, please use the following manifest URL: https://github.com/${{ github.repository }}/releases/download/$TAG/system.json"
